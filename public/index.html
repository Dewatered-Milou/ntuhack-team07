<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CareLoop — 雙向醫病溝通平台 Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="logo">Care<span>Loop</span></div>
    <select id="patient-select" aria-label="切換示範病人"></select>
  </header>

  <nav class="tabs">
    <button data-panel="chat" class="active">病人端・照護問答</button>
    <button data-panel="report">每日回報</button>
  </nav>

  <main>
    <!-- 病人端聊天 -->
    <section id="panel-chat" class="panel active">
      <div class="card">
        <h2 id="chat-title">照護問答</h2>
        <p class="hint">回答依據你的個人病歷與醫院衛教資料，來源都會標示；涉及臨床決策時會標「需醫師確認」並轉入回診問題清單。</p>
        <div id="chat-log"></div>
        <div class="composer">
          <form id="chat-form">
            <input id="chat-input" type="text" placeholder="輸入你的問題…" autocomplete="off" />
            <button class="primary" type="submit">送出</button>
          </form>
          <div class="composer-tools">
            <div class="model-mode">
              <div class="model-mode-row">
                <span id="mode-dot" class="mode-dot" aria-hidden="true"></span>
                <label for="model-mode-select">MODEL MODE</label>
                <select id="model-mode-select" aria-label="切換對話模式"></select>
              </div>
              <span id="model-mode-engine" class="model-mode-engine"></span>
            </div>
            <div class="suggestions" id="chat-suggestions"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- 每日回報 -->
    <section id="panel-report" class="panel">
      <div class="card">
        <h2>今日狀況回報</h2>
        <form id="report-form">
          <div class="form-grid">
            <div>
              <label for="f-pain">疼痛程度（0–10）</label>
              <input id="f-pain" type="number" min="0" max="10" value="3" required />
            </div>
            <div>
              <label for="f-temp">體溫（°C）</label>
              <input id="f-temp" type="number" min="34" max="42" step="0.1" value="36.8" required />
            </div>
            <div>
              <label for="f-mood">今天心情</label>
              <select id="f-mood">
                <option>還不錯</option>
                <option selected>普通</option>
                <option>不太好</option>
                <option>很差</option>
              </select>
            </div>
          </div>
          <label class="section-label">傷口狀況（可複選）</label>
          <div class="checks" id="f-wound">
            <label><input type="checkbox" value="紅腫" /> 紅腫</label>
            <label><input type="checkbox" value="滲液" /> 滲液</label>
            <label><input type="checkbox" value="裂開" /> 裂開</label>
            <label><input type="checkbox" value="輕微滲血" /> 輕微滲血</label>
            <label><input type="checkbox" value="大量出血" /> 大量出血</label>
          </div>
          <p class="checks" style="margin-top:0.6rem">
            <label><input type="checkbox" id="f-meds" checked /> 今天有按時服藥</label>
          </p>
          <div class="form-actions">
            <button class="primary" type="submit">送出回報</button>
            <span id="report-result"></span>
          </div>
        </form>
      </div>
      <div class="card">
        <h2>回報時間軸</h2>
        <ul class="timeline" id="timeline"></ul>
      </div>
    </section>
  </main>

  <footer>CareLoop hackathon demo・全部為合成示範資料，非真實病歷・衛教輔助定位，非醫療診斷</footer>
  <script src="app.js"></script>
</body>
</html>
